<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역별 조사 집계 추출기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --primary: #06b6d4;
            --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            --accent: #d946ef;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-neon: 0 0 20px rgba(6, 182, 212, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient background glow points */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.3;
        }

        body::before {
            background: var(--primary);
            top: 10%;
            left: 15%;
            animation: float-slow 20s infinite alternate;
        }

        body::after {
            background: var(--accent);
            bottom: 10%;
            right: 15%;
            animation: float-slow 25s infinite alternate-reverse;
        }

        @keyframes float-slow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        .container {
            z-index: 10;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        /* Glassmorphic Card */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 var(--glass-highlight);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Drag & Drop Zone */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.01);
            position: relative;
            overflow: hidden;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.03);
            box-shadow: var(--shadow-neon);
        }

        .dropzone-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .dropzone:hover .dropzone-icon {
            transform: translateY(-4px);
        }

        .dropzone-text {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .dropzone-subtext {
            font-size: 12px;
            color: var(--text-muted);
        }

        .file-input {
            display: none;
        }

        /* File Selected State */
        .file-info {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 20px;
            align-items: center;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-info-icon {
            font-size: 24px;
            margin-right: 12px;
            color: var(--primary);
        }

        .file-info-details {
            flex-grow: 1;
            overflow: hidden;
        }

        .file-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .file-remove {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-muted);
            padding: 4px;
            transition: color 0.2s ease;
        }

        .file-remove:hover {
            color: #ef4444;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 700;
            padding: 16px;
            border-radius: 14px;
            margin-top: 24px;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .btn-submit.active {
            background: var(--primary-gradient);
            border-color: transparent;
            color: white;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.25);
        }

        .btn-submit.active:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(6, 182, 212, 0.35);
        }

        .btn-submit.active:active {
            transform: translateY(0);
        }

        /* Processing State */
        .processing-wrapper {
            display: none;
            text-align: center;
            padding: 20px 0;
            animation: fadeIn 0.4s ease forwards;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.05);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .status-subtext {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Success & Failure States */
        .success-wrapper {
            display: none;
            text-align: center;
            padding: 20px 0;
            animation: fadeIn 0.4s ease forwards;
        }

        .success-icon {
            font-size: 60px;
            color: #10b981;
            margin-bottom: 20px;
            animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes scaleUp {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            margin-top: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .error-message {
            display: none;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.4;
            text-align: left;
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="cardContainer">
            <!-- 1. Upload Form Panel -->
            <div id="uploadPanel">
                <div class="header">
                    <h1>지역별 조사 집계 추출기 📊</h1>
                    <p>2026 도시 조사결과표(한성안).xlsx 파일을 업로드하면<br>필수 개수와 조사가능 개수를 비교한 지역별 집계 엑셀을 자동 생성합니다.</p>
                </div>

                <div class="dropzone" id="dropZone">
                    <span class="dropzone-icon">📥</span>
                    <div class="dropzone-text">여기에 엑셀 파일을 끌어다 놓으세요</div>
                    <div class="dropzone-subtext">또는 클릭해서 파일 선택</div>
                    <input type="file" class="file-input" id="fileInput" accept=".xlsx, .xls">
                </div>

                <div class="file-info" id="fileInfo">
                    <span class="file-info-icon">📄</span>
                    <div class="file-info-details">
                        <div class="file-name" id="fileName">파일명.xlsx</div>
                        <div class="file-size" id="fileSize">0 KB</div>
                    </div>
                    <span class="file-remove" id="fileRemove">✕</span>
                </div>

                <button class="btn-submit" id="btnSubmit" disabled>미조사 목록 추출하기</button>
                <div class="error-message" id="errorMessage">오류 발생 메시지</div>
            </div>

            <!-- 2. Processing Screen Panel -->
            <div class="processing-wrapper" id="processingPanel">
                <div class="spinner"></div>
                <div class="status-text">엑셀 파일 분석 중</div>
                <div class="status-subtext">표본배치 및 조사결과 정합성 결합 연산을 진행하고 있습니다. 잠시만 기다려 주세요.</div>
            </div>

            <!-- 3. Success Screen Panel -->
            <div class="success-wrapper" id="successPanel">
                <div class="success-icon">✓</div>
                <div class="status-text">추출 완료!</div>
                <div class="status-subtext">미조사 목록 파일이 생성되어 브라우저에서 다운로드가 시작되었습니다.</div>
                <button class="reset-btn" id="btnReset">처음으로</button>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const fileRemove = document.getElementById('fileRemove');
        const btnSubmit = document.getElementById('btnSubmit');
        const uploadPanel = document.getElementById('uploadPanel');
        const processingPanel = document.getElementById('processingPanel');
        const successPanel = document.getElementById('successPanel');
        const btnReset = document.getElementById('btnReset');
        const errorMessage = document.getElementById('errorMessage');

        let selectedFile = null;

        // Click Dropzone to open file picker
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Handle file selection
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Drag and drop event listeners
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            e.preventDefault();
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            e.preventDefault();
            dropZone.classList.remove('dragover');
        }

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        });

        // Process selected file
        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            // Check extension
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'xlsx' && ext !== 'xls') {
                showError("Excel 파일 (.xlsx, .xls)만 업로드할 수 있습니다.");
                removeFile();
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatBytes(file.size);
            
            // Show info panel
            fileInfo.style.display = 'flex';
            errorMessage.style.display = 'none';
            
            // Enable button
            btnSubmit.classList.add('active');
            btnSubmit.removeAttribute('disabled');
        }

        // Remove selected file
        fileRemove.addEventListener('click', (e) => {
            e.stopPropagation();
            removeFile();
        });

        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.style.display = 'none';
            btnSubmit.classList.remove('active');
            btnSubmit.setAttribute('disabled', 'true');
        }

        // Show Error helper
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
        }

        // Format bytes helper
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Submit action
        btnSubmit.addEventListener('click', () => {
            if (!selectedFile) return;

            // Shift panels
            uploadPanel.style.display = 'none';
            processingPanel.style.display = 'block';

            // Create form data
            const formData = new FormData();
            formData.append('file', selectedFile);

            // Fetch request
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(async response => {
                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || "파일 처리 중 예기치 못한 오류가 발생했습니다.");
                }
                
                // Read Content-Disposition to get filename
                const disposition = response.headers.get('Content-Disposition');
                let filename = `2026 도시 조사결과표(한성안)_미조사목록_${new Date().toISOString().slice(0,10)}.xlsx`;
                
                if (disposition && disposition.indexOf('filename*=') !== -1) {
                    const matches = disposition.split("filename*=UTF-8''");
                    if (matches.length > 1) {
                        filename = decodeURIComponent(matches[1]);
                    }
                }

                // Get blob and download
                return response.blob().then(blob => ({ blob, filename }));
            })
            .then(({ blob, filename }) => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);

                // Show success panel
                processingPanel.style.display = 'none';
                successPanel.style.display = 'block';
            })
            .catch(error => {
                console.error(error);
                processingPanel.style.display = 'none';
                uploadPanel.style.display = 'block';
                showError(error.message);
            });
        });

        // Reset to initial panel
        btnReset.addEventListener('click', () => {
            successPanel.style.display = 'none';
            uploadPanel.style.display = 'block';
            removeFile();
        });
    </script>
</body>
</html>
